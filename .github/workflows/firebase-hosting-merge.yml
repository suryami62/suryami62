name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0   

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.170.0'
          
      - name: Build with Hugo
        run: hugo --gc --minify
        working-directory: suryami62

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SURYAMI62_57C20 }}
          channelId: live
          projectId: suryami62-57c20

      - name: Submit URLs to IndexNow
        continue-on-error: true
        working-directory: suryami62
        env:
          HOST: suryami62.my.id
          INDEXNOW_KEY: kkgtxfzqxahzur3ca2z7z5dpj4npteap
        run: |
          set -euo pipefail

          ok=0
          for i in 1 2 3 4 5; do
            if [ "$(curl -fsS "https://$HOST/$INDEXNOW_KEY.txt" || true)" = "$INDEXNOW_KEY" ]; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "File kunci belum bisa diakses di https://$HOST/$INDEXNOW_KEY.txt"; exit 1; }

          payload=$(grep -oP '(?<=<loc>)[^<]+' public/sitemap.xml \
            | jq -R . \
            | jq -sc --arg host "$HOST" --arg key "$INDEXNOW_KEY" \
                '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: .}')
          echo "$payload" | jq .

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$payload")
          echo "IndexNow membalas HTTP $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
