{{/*
  Kerangka semua halaman. Hugo mengisi {{ block "main" . }} dengan
  isi dari home.html, projects.html, about.html, atau 404.html.
*/}}
<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="wrap stack">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
